[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pca2d-preclean"
version = "0.4.0"
description = "Two-frame weighted PCA precleaning of echelle spectra: a stellar-frame basis and an observer-frame basis, fitted jointly, with the atmosphere divided back out."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Etienne Artigau"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "astropy>=5.3",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "tqdm>=4.66",
]

[project.scripts]
pca2d-preclean = "pca2d.cli:main"
pca2d-gui = "pca2d.gui:main"

# THE ALGORITHM IS IN LBL (lbl.pca2d, the pca2d-module branch of
# https://github.com/njcuk9999/lbl), which is not on PyPI and is installed
# first, by hand (README, "Installing it"): this package is the window, the
# wrap file it runs, and pca2d.<module> as a name for lbl.pca2d.<module>.
[tool.setuptools]
packages = ["pca2d"]

# the window's header image: it ships with the package, since the window never
# fetches anything at run time
[tool.setuptools.package-data]
# (the LaTeX template of the run report is LBL's now, lbl/pca2d/templates)
pca2d = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The two warnings that were being printed by every run are now faults rather
# than noise: a constant column handed to spearmanr, and a FITS keyword too long
# for the standard spelled without HIERARCH. Only these two, so that a
# deprecation from a future numpy or astropy does not turn the net red.
filterwarnings = [
    "error::scipy.stats.ConstantInputWarning",
    "error::astropy.io.fits.verify.VerifyWarning",
]
