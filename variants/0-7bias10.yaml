# 0-7bias10: LE BIAIS COHERENT SUR LES POSES, a 10 sigmas. Le troisieme axe, et
# le seul qu'aucun essai n'avait teste: clip_weights compare chaque pose aux
# AUTRES POSES a la meme longueur d'onde, donc un residu present dans toutes
# les poses n'est aberrant pour aucune et reste invisible quel que soit le
# seuil. C'est ce qui explique que le plancher de poids n'ait rien change
# (+0.03 m/s) alors que les figures montrent des residus correles.
#
# La moyenne sur les poses, elle, gagne sqrt(316) = 17.8 contre le bruit. Sur
# TOI-2120 elle designe 2.8% du domaine au-dela de 10 sigmas et 11.4% au-dela
# de 5, et ses pires regions (1761, 1803, 1805, 1764-1769 nm, methane et eau)
# sont larges de 4 a 6 elements de resolution: des raies entieres mal
# corrigees, et non les regions bruyantes que l'exces de dispersion trouvait.
