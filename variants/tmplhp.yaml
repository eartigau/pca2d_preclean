# LE PASSE-HAUT SUR LE RESIDU AU TEMPLATE, template bati dans le repere de
# l'ETOILE et redescendu pose par pose.
#
# LE PROBLEME, pose le 2026-10-16: un savgol passe sur un spectre entier est
# tire vers le bas par chaque raie profonde. Tant que la raie est la meme
# d'une pose a l'autre ce biais est constant et la PCA ne le voit pas. Mais
# une tellurique qui balaie le coeur d'une raie stellaire avec le BERV le
# fait changer D'UNE POSE A L'AUTRE, et laisse un residu qui suit le BERV
# sans etre stellaire.
#
# Mesure sur HD 69830, raie a 688.85 nm: quand le BERV couvre ses 51 km/s la
# tellurique parcourt 0.117 nm, plusieurs largeurs de raie, et sa profondeur
# au coeur passe de 3% a 89%. L'effet etant intermittent, une correlation
# simple avec le BERV ne le voit pas (0.036 sur la campagne).
#
# LE REPERE DU CUBE NE CHANGE PAS, et c'est voulu: l'ajustement a deux
# reperes fait lui-meme le decalage du bloc stellaire, et un cube deja
# registre le ferait deux fois (wizard.py le refuse). Seul le TEMPLATE est
# bati dans le repere de l'etoile, puis ramene au repere de chaque pose.
highpass:
  frame: target             # le passe-haut APRES registration, sur la grille
                            # commune
  against_template: true
